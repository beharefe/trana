[package]
name = "trana_authority"
version = "0.1.0"
description = "Trana Authority - PDA-based authority management with passkey second factor"
edition = "2021"
publish = false
authors = ["Trana, Inc."]
license = "Apache-2.0"
repository = "https://github.com/beharefe/trana"
homepage = "https://trana.so"
documentation = "https://trana.so/docs"
readme = "README.md"
keywords = ["solana", "passkey", "webauthn", "authority", "anchor"]
categories = ["cryptography::cryptocurrencies", "authentication"]
exclude = [
  "target/",
  "tests/",
  ".github/",
  "*.sh",
]

[lib]
crate-type = ["cdylib", "lib"]
name = "trana_authority"

[features]
default = []
localnet     = ["trana_guard/localnet"]
devnet       = ["trana_guard/devnet"]
mainnet-beta = ["trana_guard/mainnet-beta"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "trana_guard/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
anchor-spl  = { version = "0.32.0" }
trana_guard = { version = "0.1.0", path = "../trana_guard", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
