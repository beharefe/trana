[package]
name = "trana_test_vault"
version = "0.1.0"
description = "Demo vault — passkey-gated SOL custody, for end-to-end testing and devnet demos"
edition = "2021"

# ⚠️  DEMO PROGRAM — not for production use
# This program exists so you can hand someone the vault address on explorer,
# watch them try (and fail) to drain it, and experience the passkey AHA moment.

[lib]
crate-type = ["cdylib", "lib"]
name = "trana_test_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "trana_guard/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.32.0" }
trana_guard = { path = "../trana_guard", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
