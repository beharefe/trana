[package]
name = "trana"
version = "0.1.0"
description = "Trana — Onchain passkey authorization primitive for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trana"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
sha2 = "0.10"
