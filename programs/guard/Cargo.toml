[package]
name = "trana"
version = "0.1.0"
description = "Trana — Onchain passkey authorization primitive for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trana"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
# Cluster selection — exactly one must be active per deployment.
# default = localnet so tests work without extra flags.
mainnet  = []
devnet   = []
testnet  = []
localnet = []
default  = ["localnet"]

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
