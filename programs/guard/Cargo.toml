[package]
name = "guard"
version = "0.1.0"
description = "Transaction Authorization Guard — Solana 2FA enforcement program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "guard"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
sha2 = "0.10"
