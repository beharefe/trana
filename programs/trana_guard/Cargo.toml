[package]
name = "trana_guard"
version = "0.1.0"
description = "Trana Guard - Onchain passkey authorization primitive for Solana"
edition = "2021"
authors = ["Trana, Inc."]
license = "Apache-2.0"
repository = "https://github.com/beharefe/trana"
homepage = "https://trana.so"
documentation = "https://trana.so/docs"
readme = "README.md"
keywords = ["solana", "passkey", "webauthn", "secp256r1", "anchor"]
categories = ["cryptography::cryptocurrencies", "authentication"]
exclude = [
  "target/",
  "tests/",
  ".github/",
  "*.sh",
]

[lib]
crate-type = ["cdylib", "lib"]
name = "trana_guard"

[features]
default = []
localnet     = []
devnet       = []
mainnet-beta = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
