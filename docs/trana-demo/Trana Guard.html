<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Trana Guard — docs + demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0a0a0b;
    --ink-2: #131316;
    --ink-3: #1c1c20;
    --ink-4: #26262c;
    --bone: #ebe8e0;
    --bone-2: #d6d2c6;
    --bone-3: rgba(235,232,224,0.62);
    --bone-4: rgba(235,232,224,0.42);
    --rule: rgba(235,232,224,0.12);
    --rule-2: rgba(235,232,224,0.22);
    --lime: #c6ff3a;
    --plasma: #ff5b1f;
    --azure: #5aa9ff;
    --amber: #f5a623;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    --display: 'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--ink);
    font-family: var(--sans);
    color: var(--bone);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--lime); color: var(--ink); }

  /* ---------- crossbar wordmark ---------- */
  .crossbar { display: inline-block; position: relative; }
  .crossbar::after {
    content: ""; position: absolute;
    left: -0.18em; right: -0.04em;
    top: 0.30em; height: 0.07em;
    background: var(--lime);
  }

  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: var(--ink-3); border: 2px solid var(--ink); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

  /* ---------- shell ---------- */
  .shell {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr);
    min-height: 100vh;
  }
  .sidebar {
    position: sticky; top: 0; align-self: start;
    height: 100vh; overflow-y: auto;
    border-right: 1px solid var(--rule);
    padding: 24px 0;
    background: var(--ink);
  }
  .sb-mark {
    display: flex; align-items: center; gap: 10px;
    padding: 0 24px 22px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 18px;
  }
  .sb-mark .word {
    font-family: var(--display); font-weight: 600;
    font-size: 22px; letter-spacing: -0.04em; line-height: 1;
    color: var(--bone);
  }
  .sb-mark .badge {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em;
    padding: 3px 7px; border: 1px solid var(--rule-2);
    color: var(--bone-3); text-transform: uppercase;
    margin-left: auto;
  }
  .sb-search {
    margin: 0 16px 18px;
    height: 32px; border: 1px solid var(--rule);
    display: flex; align-items: center; padding: 0 10px;
    font-family: var(--mono); font-size: 11px; color: var(--bone-4);
    gap: 8px;
  }
  .sb-search .k {
    margin-left: auto; font-size: 9px; letter-spacing: 0.16em;
    border: 1px solid var(--rule); padding: 2px 5px; color: var(--bone-4);
  }
  .sb-section {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--bone-4);
    padding: 14px 24px 8px;
  }
  .sb-link {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 24px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 400;
    color: var(--bone-3);
    border-left: 2px solid transparent;
    cursor: pointer; user-select: none;
    transition: color 100ms ease, background 100ms ease;
  }
  .sb-link:hover { color: var(--bone); background: rgba(235,232,224,0.025); }
  .sb-link.active {
    color: var(--bone); border-left-color: var(--lime);
    background: rgba(198,255,58,0.04);
  }
  .sb-link.sub { padding-left: 44px; font-size: 12.5px; color: var(--bone-4); }
  .sb-link.sub.active { color: var(--bone); }
  .sb-link .num {
    font-family: var(--mono); font-size: 10px; color: var(--bone-4);
    letter-spacing: 0.1em; margin-right: 4px; min-width: 16px;
  }
  .sb-link.active .num { color: var(--lime); }
  .sb-link.live { font-weight: 500; color: var(--bone); }
  .sb-link.live .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--lime); margin-left: auto;
    box-shadow: 0 0 0 0 rgba(198,255,58,0.55);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(198,255,58,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(198,255,58,0); }
    100% { box-shadow: 0 0 0 0 rgba(198,255,58,0); }
  }
  .sb-foot {
    margin-top: 28px; padding: 18px 24px; border-top: 1px solid var(--rule);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    color: var(--bone-4); text-transform: uppercase;
    display: flex; flex-direction: column; gap: 8px;
  }

  .main { min-width: 0; }

  /* ---------- top strip ---------- */
  .topstrip {
    position: sticky; top: 0; z-index: 30;
    height: 64px;
    border-bottom: 1px solid var(--rule);
    background: rgba(10,10,11,0.92);
    backdrop-filter: blur(10px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 28px;
    gap: 24px;
  }
  .ts-left { display: flex; align-items: center; gap: 10px; }
  .ts-left .word {
    font-family: var(--display); font-weight: 600; font-size: 15px;
    letter-spacing: -0.03em;
  }
  .ts-pill {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
    background: rgba(245,166,35,0.12); color: var(--amber);
    border: 1px solid rgba(245,166,35,0.32);
  }
  .ts-mid {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 240px;
  }
  .ts-mid .lbl {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.22em;
    color: var(--bone-4); text-transform: uppercase;
  }
  .ts-mid .val {
    font-family: var(--display); font-weight: 500; font-size: 22px;
    letter-spacing: -0.03em; line-height: 1;
    display: flex; align-items: baseline; gap: 6px;
  }
  .ts-mid .val .unit {
    font-family: var(--mono); font-size: 11px; color: var(--bone-3); letter-spacing: 0.06em;
  }
  .ts-mid .val.flash { animation: flash 700ms ease-out; }
  @keyframes flash {
    0%   { color: var(--lime); text-shadow: 0 0 12px rgba(198,255,58,0.55); }
    100% { color: var(--bone); text-shadow: none; }
  }
  .ts-right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .wallet-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border: 1px solid var(--rule-2);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--bone); background: transparent;
  }
  .wallet-btn:hover { border-color: var(--bone); }
  .wallet-btn.connected {
    border-color: var(--rule);
  }
  .wallet-btn .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--lime);
  }
  .wallet-btn .addr { font-family: var(--mono); font-size: 11px; }
  .wallet-btn .bal { font-family: var(--mono); font-size: 11px; color: var(--bone-3); }

  /* ---------- general typography helpers ---------- */
  .eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--bone-4);
  }
  .h1 {
    font-family: var(--display); font-weight: 500; font-size: 44px;
    letter-spacing: -0.04em; line-height: 1.05; color: var(--bone);
    margin: 0;
  }
  .h2 {
    font-family: var(--display); font-weight: 500; font-size: 22px;
    letter-spacing: -0.025em; line-height: 1.15; color: var(--bone);
    margin: 0;
  }
  .h3 {
    font-family: var(--display); font-weight: 500; font-size: 16px;
    letter-spacing: -0.01em; line-height: 1.2; color: var(--bone);
    margin: 0;
  }
  .body {
    font-family: var(--sans); font-size: 15px; line-height: 1.7;
    color: var(--bone-2);
  }
  .mono { font-family: var(--mono); }
  .muted { color: var(--bone-3); }
  .dim { color: var(--bone-4); }

  /* ---------- code blocks ---------- */
  .code {
    background: var(--ink); border: 1px solid var(--rule);
    padding: 18px 20px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.75;
    color: rgba(235,232,224,0.82); white-space: pre; overflow-x: auto;
    position: relative;
  }
  .code .c { color: rgba(235,232,224,0.40); }
  .code .k { color: var(--lime); }
  .code .a { color: var(--azure); }
  .code .s { color: #d8b65a; }
  .code .p { color: var(--plasma); }
  .code .copy {
    position: absolute; top: 10px; right: 10px;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 5px 9px; border: 1px solid var(--rule);
    background: var(--ink-2); color: var(--bone-3);
  }
  .code .copy:hover { color: var(--bone); border-color: var(--rule-2); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.14em;
    text-transform: uppercase;
    background: transparent; color: var(--bone); border: 1px solid var(--rule-2);
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--bone); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: var(--lime); color: var(--ink); border-color: var(--lime);
  }
  .btn-primary:hover { background: #d4ff5e; border-color: #d4ff5e; }
  .btn-danger {
    background: rgba(255,91,31,0.10); color: var(--plasma);
    border-color: rgba(255,91,31,0.42);
  }
  .btn-danger:hover { background: rgba(255,91,31,0.18); border-color: var(--plasma); }
  .btn-ghost { background: transparent; color: var(--bone-3); border-color: var(--rule); }
  .btn-ghost:hover { color: var(--bone); border-color: var(--rule-2); }

  /* ---------- pills / badges ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--rule-2); color: var(--bone-3);
  }
  .pill.lime { color: var(--lime); border-color: rgba(198,255,58,0.38); background: rgba(198,255,58,0.06); }
  .pill.plasma { color: var(--plasma); border-color: rgba(255,91,31,0.4); background: rgba(255,91,31,0.06); }
  .pill.azure { color: var(--azure); border-color: rgba(90,169,255,0.38); background: rgba(90,169,255,0.06); }
  .pill.amber { color: var(--amber); border-color: rgba(245,166,35,0.4); background: rgba(245,166,35,0.06); }
  .pill .dot {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }

  /* ---------- shake ---------- */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }
  .shake { animation: shake 320ms ease; }

  /* ---------- toast ---------- */
  .toast-stack {
    position: fixed; bottom: 24px; right: 24px; z-index: 80;
    display: flex; flex-direction: column; gap: 10px; max-width: 360px;
  }
  .toast {
    background: var(--ink-2); border: 1px solid var(--rule-2);
    padding: 12px 16px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
    color: var(--bone); display: flex; align-items: flex-start; gap: 10px;
    animation: toast-in 220ms ease;
  }
  @keyframes toast-in {
    from { transform: translateY(8px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .toast .bar { width: 3px; align-self: stretch; background: var(--lime); }
  .toast.err .bar { background: var(--plasma); }
  .toast .body-t { display: flex; flex-direction: column; gap: 2px; }
  .toast .lbl-t {
    font-size: 9.5px; letter-spacing: 0.18em; color: var(--bone-4);
    text-transform: uppercase;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .topstrip { grid-template-columns: 1fr 1fr; }
    .ts-mid { grid-column: 1 / -1; order: 3; padding-bottom: 10px; }
  }
</style>
</head>
