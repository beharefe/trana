[package]
name        = "counter"
version     = "0.1.0"
edition     = "2021"
description = "Trana example — passkey-gated counter"

[lib]
crate-type = ["cdylib", "lib"]
name       = "counter"

[features]
default       = []
cpi           = ["no-entrypoint"]
no-entrypoint = []
no-idl        = []
no-log-ix-name = []
idl-build     = ["anchor-lang/idl-build", "trana_guard/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
trana_guard = { version = "0.1.0", features = ["cpi", "localnet"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
